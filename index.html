<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scadenzario SSL</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel2:#f0f2f5; --text:#1d2330; --muted:#677084; --line:#dde1e8;
  --accent:#2557d6; --accent-ink:#ffffff;
  --red:#c62828; --red-bg:#fde8e8; --orange:#b85c00; --orange-bg:#fff0dc; --yellow:#8a6d00; --yellow-bg:#fff8d1;
  --green:#1f7a3a; --green-bg:#e3f5e8; --violet:#6a3fb5; --violet-bg:#efe7fb; --grey:#5d6575; --grey-bg:#eceef2;
  --blue:#245a8f; --blue-bg:#e2edf8;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14171d; --panel:#1c2028; --panel2:#232833; --text:#e6e9ef; --muted:#9aa3b5; --line:#313744;
    --accent:#6b93ff; --accent-ink:#0e1320;
    --red:#ff8a80; --red-bg:#3a1f22; --orange:#ffb466; --orange-bg:#3a2a18; --yellow:#f0d36a; --yellow-bg:#36311a;
    --green:#7fd69a; --green-bg:#1a3324; --violet:#c4a6ff; --violet-bg:#2b2340; --grey:#a3abba; --grey-bg:#2a2f3a;
    --blue:#8fc0f0; --blue-bg:#1c2b3c; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
textarea{width:100%;min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px}
button:hover{background:var(--panel2)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--red)}
button.link{border:none;background:none;padding:0;color:var(--accent);text-decoration:underline}
button.small{padding:3px 8px;font-size:12.5px}
button:disabled{opacity:.5;cursor:default}

header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding:8px 16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;letter-spacing:.2px;white-space:nowrap}
.brand small{font-weight:400;color:var(--muted);margin-left:6px}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{padding:6px 10px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500}
nav a.on{background:var(--panel2);color:var(--text)}
.spacer{flex:1}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.dot.busy{background:var(--orange)} .dot.err{background:var(--red)}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel2);cursor:pointer;font-size:12.5px}

main{max-width:1400px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 14px}
h2{font-size:16px;margin:22px 0 10px}
.muted{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{padding:12px 14px;cursor:pointer;border-left:4px solid var(--line)}
.kpi .n{font-size:26px;font-weight:700;line-height:1.1}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi.sel{outline:2px solid var(--accent)}
.k-scaduto{border-left-color:var(--red)} .k-urgente{border-left-color:var(--orange)}
.k-attenzione{border-left-color:var(--yellow)} .k-dafare{border-left-color:var(--violet)} .k-ok{border-left-color:var(--green)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input[type=search]{width:240px;max-width:100%}
.filters label{display:flex;gap:6px;align-items:center;color:var(--muted)}

.tablewrap{overflow-x:auto;border-radius:10px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:var(--panel2);white-space:nowrap;position:sticky;top:0}
th.sort{cursor:pointer} th.sort:hover{color:var(--text)}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:color-mix(in srgb,var(--panel2) 60%,transparent)}
td.num,th.num{text-align:right;white-space:nowrap}
td.nowrap{white-space:nowrap}

.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-scaduto{background:var(--red-bg);color:var(--red)}
.b-urgente{background:var(--orange-bg);color:var(--orange)}
.b-attenzione{background:var(--yellow-bg);color:var(--yellow)}
.b-ok{background:var(--green-bg);color:var(--green)}
.b-dafare{background:var(--violet-bg);color:var(--violet)}
.b-senza{background:var(--blue-bg);color:var(--blue)}
.b-np,.b-nonserve{background:var(--grey-bg);color:var(--grey)}
.b-neldvr{background:var(--blue-bg);color:var(--blue)}

/* matrice */
.matrix{font-size:12px}
.matrix th,.matrix td{padding:4px 6px;text-align:center;border:1px solid var(--line);white-space:nowrap}
.matrix th{position:sticky;top:0;z-index:2;writing-mode:vertical-rl;transform:rotate(180deg);height:210px;text-transform:none;letter-spacing:0;font-weight:600}
.matrix th.az,.matrix td.az{position:sticky;left:0;z-index:1;text-align:left;background:var(--panel);writing-mode:horizontal-tb;transform:none;height:auto;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.matrix th.az{z-index:3;background:var(--panel2)}
.matrix td.c{cursor:pointer;min-width:52px}
.c-scaduto{background:var(--red-bg);color:var(--red);font-weight:600}
.c-urgente{background:var(--orange-bg);color:var(--orange);font-weight:600}
.c-attenzione{background:var(--yellow-bg);color:var(--yellow)}
.c-ok{background:var(--green-bg);color:var(--green)}
.c-dafare{background:var(--violet-bg);color:var(--violet)}
.c-senza,.c-neldvr{background:var(--blue-bg);color:var(--blue)}
.c-np,.c-nonserve{color:var(--muted)}

/* scheda azienda */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.form label.check{flex-direction:row;align-items:center;gap:8px;color:var(--text);font-size:14px}
.form .full{grid-column:1/-1}
.adm{border-top:1px solid var(--line)}
.adm:first-child{border-top:none}
.adm-head{display:grid;grid-template-columns:minmax(180px,1.6fr) 150px 110px 110px 130px auto;gap:10px;align-items:center;padding:9px 14px;cursor:pointer}
.adm-head:hover{background:var(--panel2)}
.adm-head .t{font-weight:600}
.adm-head .t .caret{display:inline-block;width:14px;color:var(--muted);transition:transform .15s}
.adm.open .adm-head .t .caret{transform:rotate(90deg)}
.adm-body{display:none;padding:4px 14px 14px 38px}
.adm.open .adm-body{display:block}
.adm-body .settings{display:flex;flex-wrap:wrap;gap:10px 16px;margin:6px 0 12px;align-items:flex-end}
.adm-body .settings label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.ref{font-size:12px;color:var(--muted);margin:2px 0 8px}
.adm.dim .adm-head .t{color:var(--muted);font-weight:500}
@media (max-width:760px){
  .adm-head{grid-template-columns:1fr auto;}
  .adm-head .hide-sm{display:none}
  .adm-body{padding-left:14px}
}

.banner{padding:10px 14px;border-radius:8px;margin-bottom:12px;border:1px solid}
.banner.warn{background:var(--orange-bg);color:var(--orange);border-color:color-mix(in srgb,var(--orange) 40%,transparent)}
.banner.info{background:var(--blue-bg);color:var(--blue);border-color:color-mix(in srgb,var(--blue) 40%,transparent)}

dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--panel);color:var(--text);width:min(560px,calc(100vw - 32px));box-shadow:0 10px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,14,22,.45)}
dialog form{padding:18px}
dialog h3{margin:0 0 12px;font-size:16px}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:560px}
.toast{background:var(--text);color:var(--bg);padding:9px 14px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.2);font-size:13.5px}
.toast.err{background:var(--red);color:#fff}

.setup{max-width:680px;margin:40px auto}
.setup ol{padding-left:20px} .setup li{margin:6px 0}
.empty{padding:30px;text-align:center;color:var(--muted)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px;font-size:12px}
.log{font-size:12.5px;max-height:260px;overflow:auto}
.log div{padding:4px 0;border-bottom:1px dashed var(--line)}
@media (max-width:600px){ main{padding:12px 16px} .bar{gap:8px} .filters input[type=search]{width:100%} }
</style>

<body>
<header>
  <div class="bar">
    <div class="brand">Scadenzario SSL<small id="demoTag"></small></div>
    <nav id="nav">
      <a href="#/scadenze" data-r="scadenze">Scadenze</a>
      <a href="#/aziende" data-r="aziende">Aziende</a>
      <a href="#/matrice" data-r="matrice">Matrice</a>
      <a href="#/impostazioni" data-r="impostazioni">Impostazioni</a>
    </nav>
    <div class="spacer"></div>
    <div class="status">
      <span class="dot" id="dot"></span><span id="syncTxt">—</span>
      <button class="small" id="btnRefresh" title="Rilegge i dati dalla cartella condivisa">Aggiorna</button>
      <span class="chip" id="userChip" title="Cambia nome utente">—</span>
    </div>
  </div>
</header>
<main id="view"></main>
<div id="toast"></div>

<!-- Dialog generico -->
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script>
"use strict";
/* =========================================================================
   Scadenzario SSL – app a file singolo.
   Dati: una cartella (es. condivisa su Dropbox) con
     config.json            catalogo adempimenti + soglie
     aziende/<id>.json      un file per azienda
   Ogni modifica rilegge il file aggiornato, applica la modifica e lo riscrive:
   così le modifiche di colleghi su altre parti dell'azienda non vanno perse.
   ========================================================================= */

const APP_VERSION = "0.1";
const POLL_MS = 30000;
const STATI_RIGA = {C:"Concluso e consegnato", DC:"Da controllare e consegnare", I:"Incompleto / da concludere", S:"Superato / da aggiornare", A:"Assente / da fare"};
const APPLICABILITA = {attivo:"Applicabile", np:"Non pertinente (NP)", nel_dvr:"Valutato nel DVR", non_serve:"Non serve", da_gestire:"Da gestire"};
const ESITI = {
  scaduto:{l:"Scaduto",c:"scaduto"}, urgente:{l:"Entro 30 gg",c:"urgente"}, attenzione:{l:"Entro 180 gg",c:"attenzione"},
  ok:{l:"In regola",c:"ok"}, dafare:{l:"Da fare",c:"dafare"}, senza:{l:"Senza scadenza",c:"senza"},
  np:{l:"NP",c:"np"}, nel_dvr:{l:"Nel DVR",c:"neldvr"}, non_serve:{l:"Non serve",c:"nonserve"}
};

const S = {
  store:null, config:null, aziende:new Map(), mtimes:new Map(), conflitti:[], errori:[],
  utente: lsGet("ssl.utente") || "", demo:false, busy:0, ultimoSync:null,
  filtri: Object.assign({q:"", adm:"", esito:"critici", rspp:false, ordina:"scadenza"}, JSON.parse(lsGet("ssl.filtri")||"{}")),
  filtriAz:{q:"", archiviate:false}, aperti:new Set(), dirty:false, route:""
};

/* ---------------------------- utilità ---------------------------------- */
function lsGet(k){ try{return localStorage.getItem(k)}catch(e){return null} }
function lsSet(k,v){ try{localStorage.setItem(k,v)}catch(e){} }
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad2 = n => String(n).padStart(2,"0");
function oggiISO(){ const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function oraISO(){ return new Date().toISOString(); }
function parseISO(s){ if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function fmtData(s){ const d=parseISO(s); return d?`${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`:""; }
function fmtMeseAnno(s){ const d=parseISO(s); return d?`${pad2(d.getMonth()+1)}/${String(d.getFullYear()).slice(2)}`:""; }
function fmtQuando(iso){ if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return iso; return d.toLocaleString("it-IT",{dateStyle:"short",timeStyle:"short"}); }
function addAnni(iso,anni){ const d=parseISO(iso); if(!d) return null; const t=new Date(d.getFullYear()+Math.floor(anni), d.getMonth()+Math.round((anni%1)*12), d.getDate());
  if(t.getDate()!==d.getDate()) t.setDate(0); return `${t.getFullYear()}-${pad2(t.getMonth()+1)}-${pad2(t.getDate())}`; }
function giorniTra(isoA,isoB){ return Math.round((parseISO(isoB)-parseISO(isoA))/86400000); }
function slug(s){ return String(s).normalize("NFKD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"azienda"; }
function uid(){ return "r"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function hash(str){ let h=5381; for(let i=0;i<str.length;i++) h=((h<<5)+h+str.charCodeAt(i))|0; return (h>>>0).toString(36); }
function rowKey(r){ return r.id || ("h"+hash([r.data,r.prot,r.rev,r.stato,r.note].join("|"))); }
function toast(msg,tipo){ const t=document.createElement("div"); t.className="toast"+(tipo?" "+tipo:""); t.textContent=msg; $("#toast").appendChild(t); setTimeout(()=>t.remove(), tipo==="err"?8000:3500); }

/* --------------------------- storage ----------------------------------- */
// Funziona sia con una cartella reale (File System Access API: Chrome/Edge)
// sia con l'Origin Private File System del browser (modalità demo).
class FolderStore{
  constructor(dir,label){ this.dir=dir; this.label=label; }
  async init(){ this.az = await this.dir.getDirectoryHandle("aziende",{create:true}); }
  async _read(h){ const f=await h.getFile(); return {data:JSON.parse(await f.text()), mtime:f.lastModified}; }
  async _write(h,data){ const w=await h.createWritable(); await w.write(JSON.stringify(data,null,1)); await w.close(); const f=await h.getFile(); return f.lastModified; }
  async getConfig(){ try{ return (await this._read(await this.dir.getFileHandle("config.json"))).data; }catch(e){ if(e.name==="NotFoundError") return null; throw e; } }
  async saveConfig(c){ return this._write(await this.dir.getFileHandle("config.json",{create:true}), c); }
  async list(){
    const files=[], conflitti=[];
    for await (const [name,h] of this.az.entries()){
      if(h.kind!=="file") continue;
      if(/^[a-z0-9-]+\.json$/.test(name)){ const f=await h.getFile(); files.push({id:name.slice(0,-5), mtime:f.lastModified}); }
      else if(/\.json$/i.test(name)) conflitti.push(name);
    }
    return {files,conflitti};
  }
  async read(id){ return this._read(await this.az.getFileHandle(id+".json")); }
  async write(id,data){ return this._write(await this.az.getFileHandle(id+".json",{create:true}), data); }
  async exists(id){ try{ await this.az.getFileHandle(id+".json"); return true; }catch(e){ return false; } }
}

// Salvataggio dell'handle della cartella tra una sessione e l'altra (IndexedDB)
const idb = {
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open("scadenzario-ssl",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async get(k){ try{ const db=await this.open(); return await new Promise(res=>{ const q=db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); }); }catch(e){ return null; } },
  async set(k,v){ try{ const db=await this.open(); await new Promise(res=>{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=res; t.onerror=res; }); }catch(e){} },
  async del(k){ try{ const db=await this.open(); await new Promise(res=>{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").delete(k); t.oncomplete=res; t.onerror=res; }); }catch(e){} }
};

/* ----------------------------- logica ---------------------------------- */
function catalogo(){ return (S.config?.catalogo)||[]; }
function catById(id){ return catalogo().find(c=>c.id===id); }
function soglie(){ return Object.assign({urgente:30, attenzione:180}, S.config?.sogliaGiorni||{}); }

function calcola(az, cid){
  const v = az.adempimenti?.[cid] || {applicabilita:"np", storico:[]};
  const cat = catById(cid) || {};
  const appl = v.applicabilita || "np";
  const date = (v.storico||[]).map(r=>r.data).filter(Boolean).sort();
  const ultima = date[date.length-1] || null;
  const per = (v.periodicitaAnni!==undefined && v.periodicitaAnni!==null && v.periodicitaAnni!=="") ? Number(v.periodicitaAnni) : cat.periodicitaAnni;
  let scadenza = null, giorni = null, esito;
  if(appl==="np") esito="np"; else if(appl==="nel_dvr") esito="nel_dvr"; else if(appl==="non_serve") esito="non_serve";
  else if(appl==="da_gestire") esito="dafare";
  else {
    if(v.scadenzaManuale) scadenza=v.scadenzaManuale;
    else if(ultima && per) scadenza=addAnni(ultima, per);
    if(!ultima && !scadenza) esito="dafare";
    else if(!scadenza) esito="senza";
    else { giorni=giorniTra(oggiISO(), scadenza); const s=soglie();
      esito = giorni<0?"scaduto": giorni<=s.urgente?"urgente": giorni<=s.attenzione?"attenzione":"ok"; }
  }
  return {cid, nome:cat.nome||cid, v, appl, ultima, per, scadenza, giorni, esito};
}
function tutteLeVoci(){
  const out=[];
  for(const az of S.aziende.values()){
    if(az.attiva===false) continue;
    for(const c of catalogo()) out.push(Object.assign(calcola(az,c.id),{az}));
  }
  return out;
}
function riepilogoAzienda(az){
  const r={scaduto:0,urgente:0,attenzione:0,dafare:0,prossima:null};
  for(const c of catalogo()){ const x=calcola(az,c.id); if(r[x.esito]!==undefined) r[x.esito]++;
    if(x.scadenza && (x.giorni??0)>=0 && (!r.prossima || x.scadenza<r.prossima.scadenza)) r.prossima=x; }
  return r;
}

/* -------------------------- caricamento -------------------------------- */
function setBusy(d){ S.busy+=d; $("#dot").className="dot"+(S.busy>0?" busy":""); }
function aggiornaStato(){
  $("#syncTxt").textContent = S.store ? `${S.store.label} · ${S.aziende.size} aziende · agg. ${S.ultimoSync?S.ultimoSync.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}):"—"}` : "nessuna cartella";
  $("#userChip").textContent = S.utente ? "👤 "+S.utente : "👤 imposta nome";
  $("#demoTag").textContent = S.demo ? "DEMO – dati di prova" : "";
}
async function caricaTutto(forza){
  if(!S.store) return false;
  setBusy(1);
  let cambiato=false;
  try{
    const cfg = await S.store.getConfig();
    if(cfg && JSON.stringify(cfg)!==JSON.stringify(S.config)){ S.config=cfg; cambiato=true; }
    if(!S.config){ S.config = configBase(); await S.store.saveConfig(S.config); cambiato=true; }
    const {files,conflitti} = await S.store.list();
    S.conflitti=conflitti; S.errori=[];
    const presenti=new Set(files.map(f=>f.id));
    for(const id of [...S.aziende.keys()]) if(!presenti.has(id)){ S.aziende.delete(id); S.mtimes.delete(id); cambiato=true; }
    const daLeggere = files.filter(f=>forza || S.mtimes.get(f.id)!==f.mtime);
    await Promise.all(daLeggere.map(async f=>{
      try{ const {data,mtime}=await S.store.read(f.id); data.id=f.id; S.aziende.set(f.id,data); S.mtimes.set(f.id,mtime); cambiato=true; }
      catch(e){ S.errori.push(`${f.id}.json: ${e.message}`); }
    }));
    S.ultimoSync=new Date(); $("#dot").classList.remove("err");
  }catch(e){ $("#dot").classList.add("err"); toast("Errore lettura dati: "+e.message,"err"); }
  finally{ setBusy(-1); aggiornaStato(); }
  return cambiato;
}
async function poll(){

async function chiediUtente(){
  if(S.utente) return true;
  const nome = await dialogo({titolo:"Chi sei?", corpo:`<p class="muted">Il nome viene salvato nel registro di ogni modifica, così il team sa chi ha fatto cosa.</p>
    <label>Nome e cognome (o sigla)<br><input name="nome" required autofocus style="width:100%"></label>`, ok:"Salva"});
  if(!dialogoOk(nome) || !nome.nome.trim()) return false;
  S.utente=nome.nome.trim(); lsSet("ssl.utente",S.utente); aggiornaStato(); return true;
}
// Rilegge il file, applica fn() sulla versione più recente, salva.
async function modifica(id, cosa, fn){
  if(!await chiediUtente()) return false;
  setBusy(1);
  try{
    let fresco;
    try{ fresco=(await S.store.read(id)).data; }
    catch(e){ if(e.name==="NotFoundError") throw new Error("il file di questa azienda non esiste più (spostato o eliminato da un collega?)"); throw e; }
    const prima=S.aziende.get(id);
    const altri = prima && fresco._meta && prima._meta && fresco._meta.versione!==prima._meta.versione ? fresco._meta.modificatoDa : null;
    const esito = fn(fresco);
    if(esito===false) return false;
    fresco._meta={versione:(fresco._meta?.versione||0)+1, modificatoIl:oraISO(), modificatoDa:S.utente};
    fresco.registro=[{quando:oraISO(), chi:S.utente, cosa}, ...(fresco.registro||[])].slice(0,300);
    delete fresco.id; const mtime=await S.store.write(id,fresco); fresco.id=id;
    S.aziende.set(id,fresco); S.mtimes.set(id,mtime);
    toast(altri ? `Salvato. Nel frattempo ${altri} aveva modificato questa azienda: anche le sue modifiche sono state mantenute.` : "Salvato");
    return true;
  }catch(e){ toast("Non salvato: "+e.message,"err"); return false; }
  finally{ setBusy(-1); render(); }
}
async function modificaConfig(cosa, fn){
  if(!await chiediUtente()) return false;
  setBusy(1);
  try{
    const fresco = (await S.store.getConfig()) || configBase();
    fn(fresco);
    fresco._meta={versione:(fresco._meta?.versione||0)+1, modificatoIl:oraISO(), modificatoDa:S.utente, ultimaModifica:cosa};
    await S.store.saveConfig(fresco); S.config=fresco; toast("Impostazioni salvate"); return true;
  }catch(e){ toast("Non salvato: "+e.message,"err"); return false; }
  finally{ setBusy(-1); render(); }
}
function voce(az,cid){ az.adempimenti=az.adempimenti||{}; return az.adempimenti[cid]=az.adempimenti[cid]||{applicabilita:"attivo",storico:[],note:""}; }

/* ----------------------------- dialoghi -------------------------------- */
function dialogo({titolo,corpo,ok="OK",annulla="Annulla",pericolo=false}){
  return new Promise(res=>{
    const d=$("#dlg"), f=$("#dlgForm");
    f.innerHTML=`<h3>${esc(titolo)}</h3>${corpo}<div class="actions"><button value="cancel" formnovalidate>${esc(annulla)}</button><button value="ok" class="${pericolo?"danger":"primary"}">${esc(ok)}</button></div>`;
    d.onclose=()=>{ if(d.returnValue==="ok"){ const o={__ok:true}; new FormData(f).forEach((v,k)=>o[k]=v); $$("input[type=checkbox]",f).forEach(c=>o[c.name]=c.checked); res(o);} else res(null); };
    d.returnValue=""; d.showModal(); const a=$("[autofocus]",f); if(a) a.focus();
  });
}
const dialogoOk = r => r && r.__ok;
function opzioni(obj,sel){ return Object.entries(obj).map(([k,l])=>`<option value="${esc(k)}"${k===sel?" selected":""}>${esc(l)}</option>`).join(""); }
function formRiga(r={}){
  return `<div class="form">
    <label>Data emissione / revisione<input type="date" name="data" value="${esc(r.data||oggiISO())}" required></label>
    <label>Rev. n°<input name="rev" value="${esc(r.rev||"")}"></label>
    <label>Prot. n° (ove previsto)<input name="prot" value="${esc(r.prot||"")}"></label>
    <label>Stato<select name="stato"><option value="">—</option>${opzioni(STATI_RIGA, r.stato??"C")}</select></label>
    <label class="full">Note<textarea name="note">${esc(r.note||"")}</textarea></label></div>`;
}
async function registraAggiornamento(id,cid){
  const az=S.aziende.get(id), x=calcola(az,cid);
  const revSucc = (()=>{ const r=(x.v.storico||[]).filter(r=>r.data).sort((a,b)=>a.data<b.data?-1:1).pop(); const n=parseInt(r?.rev,10); return isNaN(n)?"":String(n+1); })();
  const r=await dialogo({titolo:`${az.nome} · ${x.nome}: registra aggiornamento`, corpo:
    `<p class="muted" style="margin-top:0">Ultima data: ${fmtData(x.ultima)||"nessuna"}${x.per?` · periodicità ${x.per} anni`:""}</p>`+formRiga({rev:revSucc}), ok:"Registra"});
  if(!dialogoOk(r)) return;
  await modifica(id, `${x.nome}: registrato aggiornamento del ${fmtData(r.data)}${r.rev?" (rev. "+r.rev+")":""}`, az=>{
    const v=voce(az,cid); if(["np","da_gestire","non_serve"].includes(v.applicabilita)) v.applicabilita="attivo";
    v.storico=v.storico||[]; v.storico.push({id:uid(), data:r.data, rev:r.rev.trim(), prot:r.prot.trim(), stato:r.stato, note:r.note.trim()});
    delete v.scadenzaManuale;
  });
}

function bindAzienda(id){
  const a=S.aziende.get(id); if(!a) return;
  // anagrafica
  const btn=$("#btnAnag");
  $$("#anag [data-f]").forEach(el=>el.addEventListener("input",()=>{ S.dirty=true; btn.disabled=false; }));
  btn.onclick=async()=>{
    const val={}; $$("#anag [data-f]").forEach(el=>val[el.dataset.f]= el.type==="checkbox"?el.checked:el.value.trim());
    if(!val.nome){ toast("La ragione sociale non può essere vuota","err"); return; }
    const camb=Object.keys(val).filter(k=>(a[k]??(typeof val[k]==="boolean"?false:""))!==val[k]);
    S.dirty=false;
    if(!camb.length){ render(); return; }
    await modifica(id, "Anagrafica modificata: "+camb.join(", "), az=>{ for(const k of camb) az[k]=val[k]; });
  };
  $("#btnArch").onclick=async()=>{
    const arch=a.attiva!==false;
    if(arch && !confirm(`Archiviare ${a.nome}? Non comparirà più nelle scadenze (i dati restano e puoi riattivarla).`)) return;
    await modifica(id, arch?"Azienda archiviata":"Azienda riattivata", az=>{ az.attiva=!arch; });
  };
  // espandi / comprimi
  $$("[data-toggle]").forEach(el=>el.onclick=e=>{ if(e.target.closest("button")) return; const k=id+"|"+el.dataset.toggle;
    S.aperti.has(k)?S.aperti.delete(k):S.aperti.add(k); el.parentElement.classList.toggle("open"); });
  // impostazioni della voce
  $$(".adm [data-set]").forEach(el=>el.addEventListener("change",async()=>{
    const cid=el.closest(".adm").dataset.cid, campo=el.dataset.set, nome=catById(cid)?.nome||cid; let val=el.value.trim();
    if(campo==="periodicitaAnni" && val!=="") { val=Number(val.replace(",", ".")); if(isNaN(val)||val<0){ toast("Periodicità non valida","err"); return; } }
    S.aperti.add(id+"|"+cid);
    const descr = campo==="applicabilita" ? `${nome}: applicabilità → ${APPLICABILITA[val]}` : campo==="periodicitaAnni" ? `${nome}: periodicità → ${val===""?"standard":val+" anni"}` : campo==="scadenzaManuale" ? `${nome}: scadenza manuale → ${val?fmtData(val):"rimossa"}` : `${nome}: nota aggiornata`;
    await modifica(id, descr, az=>{ const v=voce(az,cid); if(val===""&&campo!=="note"&&campo!=="applicabilita") delete v[campo]; else v[campo]=val; });
  }));
  // righe storico
  $$(".adm [data-edit]").forEach(b=>b.onclick=async()=>{
    const cid=b.closest(".adm").dataset.cid, k=b.dataset.edit, nome=catById(cid)?.nome||cid;
    const r0=(a.adempimenti[cid].storico||[]).find(r=>rowKey(r)===k); if(!r0) return;
    const r=await dialogo({titolo:`${nome}: modifica revisione`, corpo:formRiga(r0), ok:"Salva"}); if(!dialogoOk(r)) return;
    await modifica(id, `${nome}: modificata revisione del ${fmtData(r0.data)}`, az=>{
      const riga=(az.adempimenti?.[cid]?.storico||[]).find(x=>rowKey(x)===k);
      if(!riga){ toast("Questa riga è stata modificata o eliminata da un collega: controlla e riprova.","err"); return false; }
      Object.assign(riga,{id:riga.id||uid(), data:r.data, rev:r.rev.trim(), prot:r.prot.trim(), stato:r.stato, note:r.note.trim()});
    });
  });
  $$(".adm [data-del]").forEach(b=>b.onclick=async()=>{
    const cid=b.closest(".adm").dataset.cid, k=b.dataset.del, nome=catById(cid)?.nome||cid;
    const r0=(a.adempimenti[cid].storico||[]).find(r=>rowKey(r)===k); if(!r0) return;
    if(!confirm(`Eliminare la revisione del ${fmtData(r0.data)||"(senza data)"} di ${nome}?`)) return;
    await modifica(id, `${nome}: eliminata revisione del ${fmtData(r0.data)} (rev. ${r0.rev||"-"}, note: ${r0.note||"-"})`, az=>{
      const st=az.adempimenti?.[cid]?.storico||[]; const i=st.findIndex(x=>rowKey(x)===k);
      if(i<0){ toast("Riga già eliminata da un collega.","err"); return false; } st.splice(i,1);
    });
  });
}
