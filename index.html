<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scadenzario SSL e Ambiente</title>
<meta name="theme-color" content="#0f4d33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#f2f7f4; --panel:#ffffff; --panel2:#eef4f0; --text:#16241d; --muted:#5f7368; --line:#dbe6df;
  --side:#0f4d33; --side2:#0b3b27; --side-text:#cfe9da; --side-on:#ffffff; --side-hl:#1f8a5b;
  --accent:#1f8a5b; --accent2:#146c45; --accent-soft:#dff3e8; --accent-ink:#ffffff;
  --rspp:#b7791f; --rspp-bg:#fff4dc; --rspp-line:#f0c46c;
  --red:#c62828; --red-bg:#fde8e8; --orange:#b85c00; --orange-bg:#fff0dc; --yellow:#8a6d00; --yellow-bg:#fff7cc;
  --green:#1f7a3a; --green-bg:#e1f4e6; --violet:#6a3fb5; --violet-bg:#efe7fb; --grey:#5d6a63; --grey-bg:#eaefec;
  --blue:#245a8f; --blue-bg:#e2edf8; --ext:#4d6b7a; --ext-bg:#e9f0f3;
  --shadow:0 1px 2px rgba(16,40,28,.06),0 4px 14px rgba(16,40,28,.06);
  --shadow-h:0 2px 4px rgba(16,40,28,.08),0 10px 28px rgba(16,40,28,.12);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1713; --panel:#16211b; --panel2:#1c2a22; --text:#e3eee8; --muted:#94a99d; --line:#2a3b31;
    --side:#0a1f15; --side2:#07180f; --side-text:#a9cdb8; --side-on:#ffffff; --side-hl:#1f8a5b;
    --accent:#3cc485; --accent2:#2fae73; --accent-soft:#183a29; --accent-ink:#06140d;
    --rspp:#f0b54a; --rspp-bg:#33270f; --rspp-line:#7a5a1c;
    --red:#ff8a80; --red-bg:#3a1f22; --orange:#ffb466; --orange-bg:#3a2a18; --yellow:#f0d36a; --yellow-bg:#36311a;
    --green:#7fd69a; --green-bg:#1a3324; --violet:#c4a6ff; --violet-bg:#2b2340; --grey:#a3b0a8; --grey-bg:#26302b;
    --blue:#8fc0f0; --blue-bg:#1c2b3c; --ext:#9fbccb; --ext-bg:#1f2b31; --shadow:none; --shadow-h:0 0 0 1px var(--accent);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
a{color:var(--accent2)}
@media (prefers-color-scheme: dark){ a{color:var(--accent)} }
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 13px;display:inline-flex;align-items:center;gap:6px}
button:hover{background:var(--panel2)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.primary:hover{background:var(--accent2)}
button.danger{color:var(--red)}
button.small{padding:4px 9px;font-size:12.5px}
button.ghost{border-color:transparent;background:transparent}
button:disabled{opacity:.5;cursor:default}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- layout con menu laterale ---------- */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,var(--side),var(--side2));color:var(--side-text);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;gap:6px;z-index:30}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;color:#fff;text-decoration:none}
.logo img{width:38px;height:38px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.logo b{display:block;font-size:16px;letter-spacing:.2px}
.logo small{display:block;font-size:11.5px;color:var(--side-text);opacity:.85}
.menu a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--side-text);text-decoration:none;font-weight:500;margin-bottom:2px}
.menu a:hover{background:rgba(255,255,255,.07);color:#fff}
.menu a.on{background:var(--side-hl);color:var(--side-on);box-shadow:0 2px 10px rgba(0,0,0,.2)}
.menu a .cnt{margin-left:auto;background:#e53935;color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px}
.side-foot .box{background:rgba(255,255,255,.06);border-radius:10px;padding:10px}
.side-foot button{width:100%;justify-content:center;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);color:#fff}
.side-foot button:hover{background:rgba(255,255,255,.16)}
.side-foot .install{background:#f0b54a;border-color:#f0b54a;color:#2b1d02;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;display:inline-block;margin-right:6px}
.dot.busy{background:#fbbf24} .dot.err{background:#f87171}
.user{display:flex;align-items:center;gap:8px;cursor:pointer}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--side-hl);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.topbar{display:none}
main{padding:24px 28px 40px;min-width:0}
.wrap{max-width:1400px;margin:0 auto}
.demo-flag{display:inline-block;background:#f0b54a;color:#2b1d02;font-weight:700;font-size:11px;border-radius:6px;padding:2px 8px;margin-left:8px;vertical-align:middle}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-100%);transition:transform .2s}
  body.menu-open aside{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:var(--side);color:#fff;padding:10px 16px}
  .topbar img{width:28px;height:28px;border-radius:8px}
  .topbar button{background:transparent;border:none;color:#fff;padding:4px}
  main{padding:16px}
  .scrim{display:none}
  body.menu-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
}

/* ---------- elementi comuni ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:24px;margin:0;letter-spacing:-.2px}
.sub{color:var(--muted);margin-top:2px}
h2{font-size:16px;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:14px 16px;cursor:pointer;position:relative;overflow:hidden;transition:transform .12s, box-shadow .12s}
.kpi:hover{transform:translateY(-1px);box-shadow:var(--shadow-h)}
.kpi .n{font-size:30px;font-weight:800;line-height:1.05}
.kpi .l{color:var(--muted);font-size:12.5px;margin-top:2px}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line)}
.kpi.sel{outline:2px solid var(--accent);outline-offset:-2px}
.k-scaduto::before{background:var(--red)} .k-scaduto .n{color:var(--red)}
.k-urgente::before{background:var(--orange)} .k-urgente .n{color:var(--orange)}
.k-attenzione::before{background:#d4b106} .k-dafare::before{background:var(--violet)} .k-ok::before{background:var(--green)} .k-tutti::before{background:var(--accent)}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters input[type=search]{width:260px;max-width:100%}
.filters label{display:flex;gap:6px;align-items:center;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{border:none;border-radius:0;padding:6px 12px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

.tablewrap{overflow-x:auto;border-radius:var(--r)}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:var(--panel2);white-space:nowrap;position:sticky;top:0;z-index:1}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
td.num,th.num{text-align:right;white-space:nowrap}
td.nowrap{white-space:nowrap}
tr.is-rspp td:first-child{box-shadow:inset 4px 0 0 var(--rspp)}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-scaduto{background:var(--red-bg);color:var(--red)}
.b-urgente{background:var(--orange-bg);color:var(--orange)}
.b-attenzione{background:var(--yellow-bg);color:var(--yellow)}
.b-ok{background:var(--green-bg);color:var(--green)}
.b-dafare{background:var(--violet-bg);color:var(--violet)}
.b-senza{background:var(--blue-bg);color:var(--blue)}
.b-np,.b-nonserve{background:var(--grey-bg);color:var(--grey)}
.b-neldvr{background:var(--blue-bg);color:var(--blue)}
.b-esterno{background:var(--ext-bg);color:var(--ext);border:1px dashed color-mix(in srgb,var(--ext) 55%,transparent)}
.rspp-tag{display:inline-flex;align-items:center;gap:3px;background:var(--rspp-bg);color:var(--rspp);border:1px solid var(--rspp-line);border-radius:999px;font-size:11px;font-weight:800;padding:1px 7px 1px 5px;letter-spacing:.3px;vertical-align:middle;white-space:nowrap}
.rspp-tag svg{width:13px;height:13px;stroke-width:2.4}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px;font-size:12px}

/* ---------- card aziende ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{display:flex;flex-direction:column;text-decoration:none;color:inherit;position:relative;overflow:hidden;transition:transform .12s, box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
.card .stripe{height:6px;background:var(--green)}
.card .stripe.s-scaduto{background:var(--red)} .card .stripe.s-urgente{background:var(--orange)} .card .stripe.s-attenzione{background:#d4b106} .card .stripe.s-dafare{background:var(--violet)} .card .stripe.s-none{background:var(--line)}
.card.rspp{border-color:var(--rspp-line);box-shadow:0 0 0 1px var(--rspp-line),var(--shadow)}
.card .body{padding:14px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.card .name{font-weight:700;font-size:15.5px;line-height:1.25;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.card .meta{color:var(--muted);font-size:12.5px}
.card .counts{display:flex;gap:6px;flex-wrap:wrap}
.card .foot{border-top:1px solid var(--line);padding:9px 16px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;background:var(--panel2)}
.card .ok-all{color:var(--green);font-weight:600;font-size:13px;display:flex;align-items:center;gap:5px}
.card .corner{position:absolute;top:6px;right:0;background:var(--rspp);color:#fff;font-size:10.5px;font-weight:800;padding:3px 10px 3px 8px;border-radius:0 0 0 10px;display:flex;align-items:center;gap:3px;letter-spacing:.4px}
.card .corner svg{width:12px;height:12px;stroke-width:2.6}
.card.archiviata{opacity:.6}

/* ---------- calendario ---------- */
.cal-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cal-head .mese{font-size:20px;font-weight:700;min-width:170px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-radius:var(--r);overflow:hidden}
.cal .dow{background:var(--panel2);padding:8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.cal .day{min-height:108px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;background:var(--panel);min-width:0}
.cal .day:nth-child(7n){border-right:none}
.cal .day.out{background:var(--panel2);color:var(--muted)}
.cal .day.out .ev{opacity:.6}
.cal .day:hover{background:color-mix(in srgb,var(--accent-soft) 50%,var(--panel))}
.cal .day.sel{outline:2px solid var(--accent);outline-offset:-2px}
.cal .dn{font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.cal .day.today .dn span:first-child{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px}
.cal .ev{font-size:11px;line-height:1.25;border-radius:5px;padding:2px 6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;border-left:3px solid transparent}
.ev.e-scaduto{background:var(--red-bg);color:var(--red);border-left-color:var(--red)}
.ev.e-urgente{background:var(--orange-bg);color:var(--orange);border-left-color:var(--orange)}
.ev.e-attenzione{background:var(--yellow-bg);color:var(--yellow);border-left-color:#d4b106}
.ev.e-ok{background:var(--green-bg);color:var(--green);border-left-color:var(--green)}
.ev.e-esterno{background:var(--ext-bg);color:var(--ext);border-left-color:var(--ext);border-style:dashed}
.ev.rspp{font-weight:700}
.cal .more{font-size:11px;color:var(--muted);padding-left:4px}
.cal .dots{display:none;gap:3px;flex-wrap:wrap}
.cal .dots i{width:7px;height:7px;border-radius:50%;display:block}
.cal-layout{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
.daylist .it{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.daylist .it:last-child{border-bottom:none}
@media (max-width:1100px){ .cal-layout{grid-template-columns:1fr} }
@media (max-width:700px){
  .cal .day{min-height:54px;padding:4px}
  .cal .ev,.cal .more{display:none}
  .cal .dots{display:flex}
  .cal .dow{padding:6px 2px;text-align:center;font-size:10.5px}
}

/* ---------- matrice ---------- */
.matrix{font-size:12px}
.matrix th,.matrix td{padding:4px 6px;text-align:center;border:1px solid var(--line);white-space:nowrap}
.matrix th{position:sticky;top:0;z-index:2;writing-mode:vertical-rl;transform:rotate(180deg);height:210px;text-transform:none;letter-spacing:0;font-weight:600;background:var(--panel2)}
.matrix th.az,.matrix td.az{position:sticky;left:0;z-index:1;text-align:left;background:var(--panel);writing-mode:horizontal-tb;transform:none;height:auto;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.matrix th.az{z-index:3;background:var(--panel2)}
.matrix tr.is-rspp td.az{box-shadow:inset 4px 0 0 var(--rspp)}
.matrix td.c{cursor:pointer;min-width:52px}
.c-scaduto{background:var(--red-bg);color:var(--red);font-weight:600}
.c-urgente{background:var(--orange-bg);color:var(--orange);font-weight:600}
.c-attenzione{background:var(--yellow-bg);color:var(--yellow)}
.c-ok{background:var(--green-bg);color:var(--green)}
.c-dafare{background:var(--violet-bg);color:var(--violet)}
.c-senza,.c-neldvr{background:var(--blue-bg);color:var(--blue)}
.c-esterno{background:var(--ext-bg);color:var(--ext);font-style:italic}
.c-np,.c-nonserve{color:var(--muted)}

/* ---------- scheda azienda ---------- */
.hero{padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.hero.rspp{border-color:var(--rspp-line);background:linear-gradient(90deg,var(--rspp-bg),var(--panel) 60%)}
.hero .big{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero .stats{display:flex;gap:8px;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.form label.check{flex-direction:row;align-items:center;gap:8px;color:var(--text);font-size:14px}
.form .full{grid-column:1/-1}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin:4px 0 14px;overflow-x:auto}
.tab{border:none;background:none;border-radius:10px 10px 0 0;padding:10px 16px;font-weight:600;color:var(--muted);margin-bottom:-2px;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{background:var(--panel2);color:var(--text)}
.tab.on{color:var(--accent2);border-bottom-color:var(--accent);background:var(--panel)}
@media (prefers-color-scheme: dark){ .tab.on{color:var(--accent)} }
.tab .n{background:var(--panel2);color:var(--muted);border-radius:999px;padding:0 7px;font-size:12px;font-weight:600}
.tab .crit{background:var(--red);color:#fff;border-radius:999px;padding:0 7px;font-size:11.5px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chipf{border-radius:999px;padding:5px 12px;font-size:13px}
.chipf b{opacity:.75;margin-left:2px}
.chipf.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chipf.cf-scaduto:not(.on){color:var(--red)} .chipf.cf-urgente:not(.on){color:var(--orange)} .chipf.cf-attenzione:not(.on){color:var(--yellow)}
.chipf.cf-ok:not(.on){color:var(--green)} .chipf.cf-dafare:not(.on){color:var(--violet)} .chipf.cf-neldvr:not(.on),.chipf.cf-senza:not(.on){color:var(--blue)} .chipf.cf-esterno:not(.on){color:var(--ext)}
details.anag>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-weight:600}
details.anag>summary::-webkit-details-marker{display:none}
details.anag[open]>summary{margin-bottom:12px}
.adm{border-top:1px solid var(--line)}
.adm:first-child{border-top:none}
.adm-head{display:grid;grid-template-columns:minmax(180px,1.6fr) 140px 105px 105px 150px auto;gap:10px;align-items:center;padding:10px 16px;cursor:pointer}
.adm-head:hover{background:var(--panel2)}
.adm-head .t{font-weight:600}
.adm-head .t .caret{display:inline-block;width:14px;color:var(--muted);transition:transform .15s}
.adm.open .adm-head .t .caret{transform:rotate(90deg)}
.adm-body{display:none;padding:4px 16px 16px 40px;background:color-mix(in srgb,var(--panel2) 40%,transparent)}
.adm.open .adm-body{display:block}
.adm-body .settings{display:flex;flex-wrap:wrap;gap:10px 16px;margin:8px 0 12px;align-items:flex-end}
.adm-body .settings label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.adm-body .settings label.sw{flex-direction:row;align-items:center;gap:8px;color:var(--text);font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.ref{font-size:12px;color:var(--muted);margin:6px 0 4px}
.adm.dim .adm-head .t{color:var(--muted);font-weight:500}
.adm.ext .adm-head .date{color:var(--muted);font-style:italic}
@media (max-width:760px){
  .adm-head{grid-template-columns:1fr auto;}
  .adm-head .hide-sm{display:none}
  .adm-body{padding-left:16px}
}

.banner{padding:10px 14px;border-radius:10px;margin-bottom:14px;border:1px solid}
.banner.warn{background:var(--orange-bg);color:var(--orange);border-color:color-mix(in srgb,var(--orange) 40%,transparent)}
.banner.info{background:var(--accent-soft);color:var(--accent2);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}

dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--panel);color:var(--text);width:min(580px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(6,24,15,.5)}
dialog form{padding:20px}
dialog h3{margin:0 0 12px;font-size:17px}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:560px}

<script>
"use strict";
/* =========================================================================
   Scadenzario SSL e Ambiente – app a file singolo (installabile come app desktop/PWA).
   Dati: una cartella (es. condivisa su Dropbox) con
     config.json            catalogo adempimenti + soglie
     aziende/<id>.json      un file per azienda
   Ogni modifica rilegge il file aggiornato, applica la modifica e lo riscrive:
   così le modifiche dei colleghi su altre parti dell'azienda non vanno perse.
   ========================================================================= */

const APP_VERSION = "0.2";
const POLL_MS = 30000;
const STATI_RIGA = {C:"Concluso e consegnato", DC:"Da controllare e consegnare", I:"Incompleto / da concludere", S:"Superato / da aggiornare", A:"Assente / da fare"};
const APPLICABILITA = {attivo:"Applicabile", np:"Non pertinente (NP)", nel_dvr:"Valutato nel DVR", non_serve:"Non serve", da_gestire:"Da valutare"};
const ESITI = {
  scaduto:{l:"Scaduto",c:"scaduto"}, urgente:{l:"Entro 30 gg",c:"urgente"}, attenzione:{l:"Entro 180 gg",c:"attenzione"},
  ok:{l:"In regola",c:"ok"}, dafare:{l:"Da fare",c:"dafare"}, senza:{l:"Senza scadenza",c:"senza"},
  esterno:{l:"Non in gestione",c:"esterno"},
  np:{l:"NP",c:"np"}, nel_dvr:{l:"Nel DVR",c:"neldvr"}, non_serve:{l:"Non serve",c:"nonserve"}
};
const PESO = {scaduto:5, urgente:4, dafare:3, attenzione:2, ok:1};
const SEZIONI_BASE = [
  {id:"vr", nome:"Valutazioni dei rischi", breve:"Valutazioni rischi"},
  {id:"ssl", nome:"Adempimenti SSL", breve:"Adempimenti SSL"},
  {id:"amb", nome:"Adempimenti ambientali", breve:"Ambiente"},
  {id:"altro", nome:"Altri adempimenti", breve:"Altri"}
];
const SEZ_DEFAULT = {dvr:"vr",rumore:"vr",vibrazioni:"vr",atex:"vr",roa:"vr",cem:"vr",amianto:"vr",vdt:"vr",chimico:"vr",mmc:"vr",ocra:"vr",slc:"vr",
  terra:"ssl",pe:"ssl",evacuazione:"ssl",riunione:"ssl",scariche:"ssl",scia:"ssl",cpi:"ssl",sollevamento:"ssl",
  aua:"amb",mud:"amb",fgas:"amb",emissioni:"amb",scarichi:"amb",acustica:"amb", haccp:"altro"};
const FILTRI_STATO = [["pertinenti","Tutti i pertinenti"],["scaduto","Scaduti"],["urgente","Entro 30 gg"],["attenzione","Entro 180 gg"],["ok","In regola"],["dafare","Da fare"],["senza","Senza scadenza"],["nel_dvr","Valutati nel DVR"],["esterno","Non in gestione"],["np","NP / non serve"]];
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];

const ICO = {
  scadenze:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/>',
  calendario:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h2M14 14h2M8 17h2"/>',
  aziende:'<path d="M3 21h18M5 21V7l7-4 7 4v14"/><path d="M9 21v-5h6v5M9 10h.01M15 10h.01M9 13h.01M15 13h.01"/>',
  matrice:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  impostazioni:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  shield:'<path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  print:'<path d="M6 9V3h12v6M6 18H4v-7h16v7h-2"/><rect x="6" y="14" width="12" height="7"/>',
  download:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  plus:'<path d="M12 5v14M5 12h14"/>'
};
const ico = (n,cls="i") => `<svg class="${cls}" viewBox="0 0 24 24">${ICO[n]}</svg>`;
const RSPP_TAG = `<span class="rspp-tag" title="Lo studio svolge il ruolo di RSPP">${ico("shield")}RSPP</span>`;

const S = {
  store:null, config:null, aziende:new Map(), mtimes:new Map(), conflitti:[], errori:[],
  utente: lsGet("ssl.utente") || "", demo:false, busy:0, ultimoSync:null,
  filtri: Object.assign({q:"", adm:"", sez:"", esito:"critici", rspp:false, ordina:"scadenza", esterni:false, referente:""},JSON.parse(lsGet("ssl.filtri")||"{}")),
  filtriAz: Object.assign({q:"", archiviate:false, rspp:false, critiche:false, ordina:"nome"}, JSON.parse(lsGet("ssl.filtriAz")||"{}")),
  cal:{anno:new Date().getFullYear(), mese:new Date().getMonth(), sel:null, esterni:false, rspp:false, sez:""},
  scheda:{tab:"vr", stato:"pertinenti"}, matSez:"vr",
  aperti:new Set(), dirty:false, route:"", installPrompt:null
};

/* ---------------------------- utilità ---------------------------------- */
function lsGet(k){ try{return localStorage.getItem(k)}catch(e){return null} }
function lsSet(k,v){ try{localStorage.setItem(k,v)}catch(e){} }
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad2 = n => String(n).padStart(2,"0");
const isoDi = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
function oggiISO(){ return isoDi(new Date()); }
function oraISO(){ return new Date().toISOString(); }
function parseISO(s){ if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function fmtData(s){ const d=parseISO(s); return d?`${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`:""; }
function fmtMeseAnno(s){ const d=parseISO(s); return d?`${pad2(d.getMonth()+1)}/${String(d.getFullYear()).slice(2)}`:""; }
function fmtQuando(iso){ if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return iso; return d.toLocaleString("it-IT",{dateStyle:"short",timeStyle:"short"}); }
function addAnni(iso,anni){ const d=parseISO(iso); if(!d) return null; const t=new Date(d.getFullYear()+Math.floor(anni), d.getMonth()+Math.round((anni%1)*12), d.getDate());
  if(t.getDate()!==d.getDate()) t.setDate(0); return isoDi(t); }
function giorniTra(isoA,isoB){ return Math.round((parseISO(isoB)-parseISO(isoA))/86400000); }
function slug(s){ return String(s).normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"azienda"; }
function uid(){ return "r"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function hash(str){ let h=5381; for(let i=0;i<str.length;i++) h=((h<<5)+h+str.charCodeAt(i))|0; return (h>>>0).toString(36); }
function rowKey(r){ return r.id || ("h"+hash([r.data,r.prot,r.rev,r.stato,r.note].join("|"))); }
function iniziali(n){ return (n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join("")||"?"; }
function toast(msg,tipo){ const t=document.createElement("div"); t.className="toast"+(tipo?" "+tipo:""); t.textContent=msg; $("#toast").appendChild(t); setTimeout(()=>t.remove(), tipo==="err"?8000:3500); }
function scarica(nome, contenuto, tipo){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([contenuto],{type:tipo})); a.download=nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
function giorniTxt(g){ return g===null||g===undefined?"": g<0?`${-g} gg fa`: g===0?"oggi":`tra ${g} gg`; }

/* --------------------------- storage ----------------------------------- */
class FolderStore{
  constructor(dir,label){ this.dir=dir; this.label=label; }
  async init(){ this.az = await this.dir.getDirectoryHandle("aziende",{create:true}); }
  async _read(h){ const f=await h.getFile(); return {data:JSON.parse(await f.text()), mtime:f.lastModified}; }
  async _write(h,data){ const w=await h.createWritable(); await w.write(JSON.stringify(data,null,1)); await w.close(); const f=await h.getFile(); return f.lastModified; }
  async getConfig(){ try{ return (await this._read(await this.dir.getFileHandle("config.json"))).data; }catch(e){ if(e.name==="NotFoundError") return null; throw e; } }
  async saveConfig(c){ return this._write(await this.dir.getFileHandle("config.json",{create:true}), c); }
  async list(){
    const files=[], conflitti=[];
    for await (const [name,h] of this.az.entries()){
      if(h.kind!=="file") continue;
      if(/^[a-z0-9-]+\.json$/.test(name)){ const f=await h.getFile(); files.push({id:name.slice(0,-5), mtime:f.lastModified}); }
      else if(/\.json$/i.test(name)) conflitti.push(name);
    }
    return {files,conflitti};
  }
  async read(id){ return this._read(await this.az.getFileHandle(id+".json")); }
  async write(id,data){ return this._write(await this.az.getFileHandle(id+".json",{create:true}), data); }
  async exists(id){ try{ await this.az.getFileHandle(id+".json"); return true; }catch(e){ return false; } }
}
const idb = {
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open("scadenzario-ssl",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async get(k){ try{ const db=await this.open(); return await new Promise(res=>{ const q=db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); }); }catch(e){ return null; } },
  async set(k,v){ try{ const db=await this.open(); await new Promise(res=>{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=res; t.onerror=res; }); }catch(e){} },
  async del(k){ try{ const db=await this.open(); await new Promise(res=>{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").delete(k); t.oncomplete=res; t.onerror=res; }); }catch(e){} }
};

/* ----------------------------- logica ---------------------------------- */
function catalogo(){ return (S.config?.catalogo)||[]; }
function catById(id){ return catalogo().find(c=>c.id===id); }
function sezioni(){ return (S.config?.sezioni)||SEZIONI_BASE; }
function sezDi(cid){ const c=catById(cid); return c?.sezione || SEZ_DEFAULT[cid] || (String(cid).startsWith("x-")?"vr":"altro"); }
function nomeSez(id){ return sezioni().find(s=>s.id===id)?.nome || id; }
function opzioniSez(sel,tutte="Tutte le sezioni"){ return `<option value="">${tutte}</option>`+sezioni().map(s=>`<option value="${s.id}"${s.id===sel?" selected":""}>${esc(s.nome)}</option>`).join(""); }
// Aggiorna config.json creati con versioni precedenti (sezioni + nuovi adempimenti ambientali)
function migraConfig(c){
  if((c.versioneFormato||1)>=2) return false;
  c.sezioni=c.sezioni||SEZIONI_BASE.map(s=>({...s}));
  for(const x of c.catalogo) if(!x.sezione) x.sezione=SEZ_DEFAULT[x.id] || (x.id.startsWith("x-")?"vr":"altro");
  for(const n of configBase().catalogo) if(!c.catalogo.some(x=>x.id===n.id)) c.catalogo.push(n);
  c.versioneFormato=2; return true;
}
function soglie(){ return Object.assign({urgente:30, attenzione:180}, S.config?.sogliaGiorni||{}); }
function inGestione(v){ return v.gestione!==false; }

function calcola(az, cid){
  const v = az.adempimenti?.[cid] || {applicabilita:"np", storico:[]};
  const cat = catById(cid) || {};
  const appl = v.applicabilita || "np";
  const date = (v.storico||[]).map(r=>r.data).filter(Boolean).sort();
  const ultima = date[date.length-1] || null;
  const per = (v.periodicitaAnni!==undefined && v.periodicitaAnni!==null && v.periodicitaAnni!=="") ? Number(v.periodicitaAnni) : cat.periodicitaAnni;
  let scadenza = null, giorni = null, esito;
  if(appl==="np") esito="np"; else if(appl==="nel_dvr") esito="nel_dvr"; else if(appl==="non_serve") esito="non_serve";
  else {
    if(v.scadenzaManuale) scadenza=v.scadenzaManuale;
    else if(ultima && per) scadenza=addAnni(ultima, per);
    if(scadenza) giorni=giorniTra(oggiISO(), scadenza);
    if(!inGestione(v)) esito="esterno";               // informativo: mai critico
    else if(appl==="da_gestire") esito="dafare";
    else if(!ultima && !scadenza) esito="dafare";
    else if(!scadenza) esito="senza";
    else { const s=soglie(); esito = giorni<0?"scaduto": giorni<=s.urgente?"urgente": giorni<=s.attenzione?"attenzione":"ok"; }
  }
  return {cid, nome:cat.nome||cid, v, appl, ultima, per, scadenza, giorni, esito, gestito:inGestione(v)};
}
function tutteLeVoci(){
  const out=[];
  for(const az of S.aziende.values()){
    if(az.attiva===false) continue;
    for(const c of catalogo()) out.push(Object.assign(calcola(az,c.id),{az}));
  }
  return out;
}
function riepilogoAzienda(az){
  const r={scaduto:0,urgente:0,attenzione:0,dafare:0,ok:0,esterno:0,prossima:null,peggiore:"none"};
  for(const c of catalogo()){ const x=calcola(az,c.id); if(r[x.esito]!==undefined) r[x.esito]++;
    if(x.esito!=="esterno" && x.scadenza && (x.giorni??0)>=0 && (!r.prossima || x.scadenza<r.prossima.scadenza)) r.prossima=x;
    if(PESO[x.esito] && (r.peggiore==="none" || PESO[x.esito]>PESO[r.peggiore])) r.peggiore=x.esito; }
  r.punteggio=r.scaduto*1000+r.urgente*100+r.dafare*10+r.attenzione;
  return r;
}

/* -------------------------- caricamento -------------------------------- */
function setBusy(d){ S.busy+=d; $("#dot").className="dot"+(S.busy>0?" busy":""); }
function aggiornaStato(){
  $("#syncTxt").textContent = S.store ? `${S.store.label} · ${S.aziende.size} aziende` : "Nessuna cartella";
  $("#syncTime").textContent = S.ultimoSync ? "Aggiornato alle "+S.ultimoSync.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}) : "";
  $("#userName").textContent = S.utente || "Imposta il tuo nome";
  $("#avatar").textContent = iniziali(S.utente);
  disegnaMenu();
}
function disegnaMenu(){
  const r=(S.route.split("/")[1])||"scadenze";
  let crit=0; if(S.store) for(const x of tutteLeVoci()) if(x.esito==="scaduto"||x.esito==="urgente") crit++;
  const voci=[["scadenze","Scadenze",crit],["calendario","Calendario"],["aziende","Aziende"],["matrice","Matrice"],["impostazioni","Impostazioni"]];
  $("#nav").innerHTML = voci.map(([id,l,n])=>`<a href="#/${id}" class="${(r===id||(r==="azienda"&&id==="aziende"))?"on":""}">${ico(id)}${l}${n?`<span class="cnt" title="Scaduti + entro 30 gg">${n}</span>`:""}</a>`).join("");
}
async function caricaTutto(forza){
  if(!S.store) return false;
  setBusy(1);
  let cambiato=false;
  try{
    const cfg = await S.store.getConfig();
    if(cfg && JSON.stringify(cfg)!==JSON.stringify(S.config)){ S.config=cfg; cambiato=true; }
    if(!S.config){ S.config = configBase(); await S.store.saveConfig(S.config); cambiato=true; }
    if(migraConfig(S.config)){ S.config._meta=Object.assign({},S.config._meta,{modificatoIl:oraISO(),modificatoDa:S.utente||"aggiornamento automatico",ultimaModifica:"migrazione a sezioni"}); await S.store.saveConfig(S.config); cambiato=true; }
    const {files,conflitti} = await S.store.list();
    S.conflitti=conflitti; S.errori=[];
    const presenti=new Set(files.map(f=>f.id));
    for(const id of [...S.aziende.keys()]) if(!presenti.has(id)){ S.aziende.delete(id); S.mtimes.delete(id); cambiato=true; }
    const daLeggere = files.filter(f=>forza || S.mtimes.get(f.id)!==f.mtime);
    await Promise.all(daLeggere.map(async f=>{
      try{ const {data,mtime}=await S.store.read(f.id); data.id=f.id; S.aziende.set(f.id,data); S.mtimes.set(f.id,mtime); cambiato=true; }
      catch(e){ S.errori.push(`${f.id}.json: ${e.message}`); }
    }));
    S.ultimoSync=new Date(); $("#dot").classList.remove("err");
  }catch(e){ $("#dot").classList.add("err"); toast("Errore lettura dati: "+e.message,"err"); }
  finally{ setBusy(-1); aggiornaStato(); }
  return cambiato;
}
async function poll(){
  if(!S.store || document.hidden || S.busy>0) return;
  const cambiato = await caricaTutto(false);
  if(!cambiato) return;
  if(S.dirty || $("#dlg").open || (document.activeElement && $("#view").contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))){
    mostraAvvisoAggiornamenti(); return;
  }
  render();
}
function mostraAvvisoAggiornamenti(){
  if($("#avvisoAgg")) return;
  const b=document.createElement("div"); b.id="avvisoAgg"; b.className="banner info";
  b.innerHTML=`Un collega ha aggiornato dei dati. <button class="small" type="button">Mostra aggiornamenti</button>`;
  b.querySelector("button").onclick=()=>{ if(S.dirty && !confirm("Hai modifiche non salvate nell'anagrafica. Scartarle?")) return; S.dirty=false; render(); };
  $("#view").prepend(b);
}

/* ------------------------- scrittura sicura ---------------------------- */
async function chiediUtente(){
  if(S.utente) return true;
  const nome = await dialogo({titolo:"Chi sei?", corpo:`<p class="muted">Il nome viene salvato nel registro di ogni modifica, così il team sa chi ha fatto cosa.</p>
    <label>Nome e cognome (o sigla)<br><input name="nome" required autofocus style="width:100%"></label>`, ok:"Salva"});
  if(!dialogoOk(nome) || !nome.nome.trim()) return false;
  S.utente=nome.nome.trim(); lsSet("ssl.utente",S.utente); aggiornaStato(); return true;
}
async function modifica(id, cosa, fn){
  if(!await chiediUtente()) return false;
  setBusy(1);
  try{
    let fresco;
    try{ fresco=(await S.store.read(id)).data; }
    catch(e){ if(e.name==="NotFoundError") throw new Error("il file di questa azienda non esiste più (spostato o eliminato da un collega?)"); throw e; }
    const prima=S.aziende.get(id);
    const altri = prima && fresco._meta && prima._meta && fresco._meta.versione!==prima._meta.versione ? fresco._meta.modificatoDa : null;
    if(fn(fresco)===false) return false;
    fresco._meta={versione:(fresco._meta?.versione||0)+1, modificatoIl:oraISO(), modificatoDa:S.utente};
    fresco.registro=[{quando:oraISO(), chi:S.utente, cosa}, ...(fresco.registro||[])].slice(0,300);
    delete fresco.id; const mtime=await S.store.write(id,fresco); fresco.id=id;
    S.aziende.set(id,fresco); S.mtimes.set(id,mtime);
    toast(altri ? `Salvato. Nel frattempo ${altri} aveva modificato questa azienda: anche le sue modifiche sono state mantenute.` : "Salvato");
    return true;
  }catch(e){ toast("Non salvato: "+e.message,"err"); return false; }
  finally{ setBusy(-1); render(); }
}
async function modificaConfig(cosa, fn){
  if(!await chiediUtente()) return false;
  setBusy(1);
  try{
    const fresco = (await S.store.getConfig()) || configBase();
    fn(fresco);
    fresco._meta={versione:(fresco._meta?.versione||0)+1, modificatoIl:oraISO(), modificatoDa:S.utente, ultimaModifica:cosa};

function dialogo({titolo,corpo,ok="OK",annulla="Annulla",pericolo=false}){
  return new Promise(res=>{
    const d=$("#dlg"), f=$("#dlgForm");
    f.innerHTML=`<h3>${esc(titolo)}</h3>${corpo}<div class="actions"><button value="cancel" formnovalidate>${esc(annulla)}</button><button value="ok" class="${pericolo?"danger":"primary"}">${esc(ok)}</button></div>`;
    d.onclose=()=>{ if(d.returnValue==="ok"){ const o={__ok:true}; new FormData(f).forEach((v,k)=>o[k]=v); $$("input[type=checkbox]",f).forEach(c=>o[c.name]=c.checked); res(o);} else res(null); };
    d.returnValue=""; d.showModal(); const a=$("[autofocus]",f); if(a) a.focus();
  });
}
const dialogoOk = r => r && r.__ok;
function opzioni(obj,sel){ return Object.entries(obj).map(([k,l])=>`<option value="${esc(k)}"${k===sel?" selected":""}>${esc(l)}</option>`).join(""); }

async function registraAggiornamento(id,cid){
  const az=S.aziende.get(id), x=calcola(az,cid);
  const revSucc = (()=>{ const r=(x.v.storico||[]).filter(r=>r.data).sort((a,b)=>a.data<b.data?-1:1).pop(); const n=parseInt(r?.rev,10); return isNaN(n)?"":String(n+1); })();
  const r=await dialogo({titolo:`${az.nome} · ${x.nome}`, corpo:
    `<p class="muted" style="margin-top:0">Registra una nuova revisione o esecuzione. Ultima data: <b>${fmtData(x.ultima)||"nessuna"}</b>${x.per?` · periodicità ${x.per} anni`:""}</p>`+formRiga({rev:revSucc})+
    `<label class="row" style="margin-top:12px;gap:8px"><input type="checkbox" name="gestione" ${x.gestito?"checked":""}> <span><b>Scadenza in gestione allo studio</b><br><span class="muted" style="font-size:12.5px">Togli la spunta se il dato è solo informativo (es. verifica fatta da altri): la data resta visibile ma non genera allarmi.</span></span></label>`, ok:"Registra"});
  if(!dialogoOk(r)) return;
  await modifica(id, `${x.nome}: registrato aggiornamento del ${fmtData(r.data)}${r.rev?" (rev. "+r.rev+")":""}${r.gestione?"":" – non in gestione"}`, az=>{
    const v=voce(az,cid); if(["np","da_gestire","non_serve"].includes(v.applicabilita)) v.applicabilita="attivo";
    v.storico=v.storico||[]; v.storico.push({id:uid(), data:r.data, rev:r.rev.trim(), prot:r.prot.trim(), stato:r.stato, note:r.note.trim()});
    if(r.gestione) delete v.gestione; else v.gestione=false;
    delete v.scadenzaManuale;
  });
}

  $("#calOggi").onclick=()=>{ const d=new Date(); c.anno=d.getFullYear(); c.mese=d.getMonth(); c.sel=oggiISO(); render(); };
  $("#calRspp").onchange=e=>{ c.rspp=e.target.checked; render(); };
  $("#calSez").onchange=e=>{ c.sez=e.target.value; render(); };
  $("#calEst").onchange=e=>{ c.esterni=e.target.checked; render(); };
  $$("[data-day]").forEach(el=>el.onclick=()=>{ c.sel=el.dataset.day; const d=parseISO(c.sel); if(d.getMonth()!==c.mese){ c.anno=d.getFullYear(); c.mese=d.getMonth(); } render(); });
  const g=$("[data-go-scaduti]"); if(g) g.onclick=()=>{ S.filtri.esito="scaduto"; salvaFiltri(); };
  $("#btnIcs").onclick=esportaIcs;
}
function esportaIcs(){
  const voci=vociCalendario().filter(x=>x.scadenza>=oggiISO()), stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const t=s=>String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Scadenzario SSL e Ambiente//IT","CALSCALE:GREGORIAN","X-WR-CALNAME:Scadenzario SSL e Ambiente"];
  for(const x of voci){ const d=x.scadenza.replace(/-/g,""), e=isoDi(new Date(parseISO(x.scadenza).getTime()+86400000)).replace(/-/g,"");
    lines.push("BEGIN:VEVENT",`UID:${x.az.id}-${x.cid}-${d}@scadenzario-ssl`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${e}`,
      `SUMMARY:${t((x.az.rsppStudio?"[RSPP] ":"")+x.az.nome+" – "+x.nome)}`,`DESCRIPTION:${t("Ultima data: "+(fmtData(x.ultima)||"—")+(x.gestito?"":"\nNon in gestione allo studio"))}`,
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Scadenza tra 30 giorni","TRIGGER:-P30D","END:VALARM","END:VEVENT"); }
  lines.push("END:VCALENDAR");
  scarica(`scadenzario_${oggiISO()}.ics`, lines.join("\r\n"), "text/calendar");
  toast(`Esportate ${voci.length} scadenze future, con promemoria 30 giorni prima`);
}

function bindAzienda(id){
  const a=S.aziende.get(id); if(!a) return;
  $$("[data-tab]").forEach(b=>b.onclick=()=>{ if(S.dirty && !confirm("Hai modifiche non salvate nell'anagrafica. Scartarle?")) return; S.dirty=false; S.scheda.tab=b.dataset.tab; S.scheda.stato="pertinenti"; render(); });
  $$("[data-stato]").forEach(b=>b.onclick=()=>{ S.scheda.stato=b.dataset.stato; render(); });
  $("#btnStampa").onclick=()=>window.print();
  const btn=$("#btnAnag");
  if(btn){
  $$("#anag [data-f]").forEach(el=>el.addEventListener("input",()=>{ S.dirty=true; btn.disabled=false; }));
  btn.onclick=async()=>{
    const val={}; $$("#anag [data-f]").forEach(el=>val[el.dataset.f]= el.type==="checkbox"?el.checked:el.value.trim());
    if(!val.nome){ toast("La ragione sociale non può essere vuota","err"); return; }
    const camb=Object.keys(val).filter(k=>(a[k]??(typeof val[k]==="boolean"?false:""))!==val[k]);
    S.dirty=false;
    if(!camb.length){ render(); return; }
    await modifica(id, "Anagrafica modificata: "+camb.join(", "), az=>{ for(const k of camb) az[k]=val[k]; });
  };
  $("#btnArch").onclick=async()=>{
    const arch=a.attiva!==false;
    if(arch && !confirm(`Archiviare ${a.nome}? Non comparirà più nelle scadenze (i dati restano e puoi riattivarla).`)) return;
    await modifica(id, arch?"Azienda archiviata":"Azienda riattivata", az=>{ az.attiva=!arch; });
  };
  }
  $$("[data-toggle]").forEach(el=>el.onclick=e=>{ if(e.target.closest("button")) return; const k=id+"|"+el.dataset.toggle;
    S.aperti.has(k)?S.aperti.delete(k):S.aperti.add(k); el.parentElement.classList.toggle("open"); });
  $$(".adm [data-set]").forEach(el=>el.addEventListener("change",async()=>{
    const cid=el.closest(".adm").dataset.cid, campo=el.dataset.set, nome=catById(cid)?.nome||cid;
    let val = el.type==="checkbox" ? el.checked : el.value.trim();

    S.aperti.add(id+"|"+cid);
    const descr = campo==="applicabilita" ? `${nome}: applicabilità → ${APPLICABILITA[val]}`
      : campo==="gestione" ? `${nome}: ${val?"scadenza ora in gestione allo studio":"scadenza non in gestione (solo informativa)"}`
      : campo==="periodicitaAnni" ? `${nome}: periodicità → ${val===""?"standard":val+" anni"}`
      : campo==="scadenzaManuale" ? `${nome}: scadenza manuale → ${val?fmtData(val):"rimossa"}` : `${nome}: nota aggiornata`;
    await modifica(id, descr, az=>{ const v=voce(az,cid);
      if(campo==="gestione"){ if(val) delete v.gestione; else v.gestione=false; return; }
      if(val===""&&campo!=="note"&&campo!=="applicabilita") delete v[campo]; else v[campo]=val; });
  }));
  $$(".adm [data-edit]").forEach(b=>b.onclick=async()=>{
    const cid=b.closest(".adm").dataset.cid, k=b.dataset.edit, nome=catById(cid)?.nome||cid;
    const r0=(a.adempimenti[cid].storico||[]).find(r=>rowKey(r)===k); if(!r0) return;
    const r=await dialogo({titolo:`${nome}: modifica revisione`, corpo:formRiga(r0), ok:"Salva"}); if(!dialogoOk(r)) return;
    await modifica(id, `${nome}: modificata revisione del ${fmtData(r0.data)}`, az=>{
      const riga=(az.adempimenti?.[cid]?.storico||[]).find(x=>rowKey(x)===k);
      if(!riga){ toast("Questa riga è stata modificata o eliminata da un collega: controlla e riprova.","err"); return false; }
      Object.assign(riga,{id:riga.id||uid(), data:r.data, rev:r.rev.trim(), prot:r.prot.trim(), stato:r.stato, note:r.note.trim()});
    });
  });
  $$(".adm [data-del]").forEach(b=>b.onclick=async()=>{
    const cid=b.closest(".adm").dataset.cid, k=b.dataset.del, nome=catById(cid)?.nome||cid;
    const r0=(a.adempimenti[cid].storico||[]).find(r=>rowKey(r)===k); if(!r0) return;
    if(!confirm(`Eliminare la revisione del ${fmtData(r0.data)||"(senza data)"} di ${nome}?`)) return;
    await modifica(id, `${nome}: eliminata revisione del ${fmtData(r0.data)} (rev. ${r0.rev||"-"}, note: ${r0.note||"-"})`, az=>{
      const st=az.adempimenti?.[cid]?.storico||[]; const i=st.findIndex(x=>rowKey(x)===k);
      if(i<0){ toast("Riga già eliminata da un collega.","err"); return false; } st.splice(i,1);
    });
  });
}

/* ------------------------------ matrice --------------------------------- */
function vistaMatrice(){
  const f=S.filtri, cat=catalogo().filter(c=>!S.matSez||sezDi(c.id)===S.matSez);
  const tabs=[...sezioni().filter(s=>catalogo().some(c=>sezDi(c.id)===s.id)).map(s=>`<button class="tab ${S.matSez===s.id?"on":""}" data-msez="${s.id}">${esc(s.nome)}</button>`),
    `<button class="tab ${!S.matSez?"on":""}" data-msez="">Tutto</button>`].join("");
  const az=[...S.aziende.values()].filter(a=>a.attiva!==false && (!f.rspp||a.rsppStudio)).sort((a,b)=>a.nome.localeCompare(b.nome));
  const testo=x=> x.esito==="np"?"NP": x.esito==="non_serve"?"—": x.esito==="nel_dvr"?"DVR": x.esito==="dafare"?"da fare": x.esito==="senza"?fmtMeseAnno(x.ultima): x.esito==="esterno"?(fmtMeseAnno(x.scadenza)||fmtMeseAnno(x.ultima)||"est."): fmtMeseAnno(x.scadenza);
  return `<div class="page-head"><div><h1>Matrice</h1><div class="sub">Aziende × adempimenti · ogni cella mostra la scadenza (mese/anno), clic per aprire la scheda</div></div></div>
  <div class="tabs">${tabs}</div>
  <div class="filters"><label><input type="checkbox" id="mrspp" ${f.rspp?"checked":""}> solo ${RSPP_TAG}</label></div>
  <div class="legend">${["scaduto","urgente","attenzione","ok","dafare","senza","nel_dvr","esterno"].map(e=>`<span class="badge b-${ESITI[e].c}">${ESITI[e].l}</span>`).join("")}<span class="badge b-np">NP</span></div>
  <div class="panel tablewrap" style="max-height:75vh"><table class="matrix"><thead><tr><th class="az">Azienda</th>${cat.map(c=>`<th title="${esc(c.nome)}">${esc(c.nome)}</th>`).join("")}</tr></thead>
  <tbody>${az.map(a=>`<tr class="${a.rsppStudio?"is-rspp":""}"><td class="az" title="${esc(a.nome)}"><a href="#/azienda/${encodeURIComponent(a.id)}">${a.rsppStudio?"🛡 ":""}${esc(a.nome)}</a></td>${cat.map(c=>{ const x=calcola(a,c.id);
    return `<td class="c c-${ESITI[x.esito].c}" data-open="${esc(a.id)}|${esc(c.id)}" title="${esc(c.nome)}: ${esc(ESITI[x.esito].l)}${x.scadenza?" – "+fmtData(x.scadenza):""}">${esc(testo(x))}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function bindMatrice(){
  $("#mrspp").onchange=e=>{ S.filtri.rspp=e.target.checked; salvaFiltri(); render(); };
  $$("[data-msez]").forEach(b=>b.onclick=()=>{ S.matSez=b.dataset.msez; render(); });
  $$("[data-open]").forEach(td=>td.onclick=()=>{ const [id,cid]=td.dataset.open.split("|"); S.aperti.add(id+"|"+cid); S.scheda.tab=sezDi(cid); S.scheda.stato="pertinenti"; location.hash="#/azienda/"+encodeURIComponent(id); });
}

function bindImpostazioni(){
  $("#btnUtente").onclick=cambiaUtente;
  $("#btnCambia").onclick=async()=>{ S.store=null; S.demo=false; S.aziende.clear(); await idb.del("cartella"); location.hash=""; render(); };
  $("#btnBackup").onclick=()=>scarica(`backup_scadenzario_${oggiISO()}.json`, JSON.stringify({esportatoIl:oraISO(), config:S.config, aziende:[...S.aziende.values()]},null,1), "application/json");
  $("#btnInstall2").onclick=installa;
  if($("#btnResetDemo")) $("#btnResetDemo").onclick=async()=>{ if(!confirm("Azzerare i dati demo?")) return; const root=await navigator.storage.getDirectory(); await root.removeEntry("demo-scadenzario",{recursive:true}); S.store=null; avviaDemo(); };
  $("#btnSoglie").onclick=()=>{ const u=parseInt($("#sUrg").value,10), t=parseInt($("#sAtt").value,10); if(!(u>0&&t>=u)){ toast("Soglie non valide","err"); return; }
    modificaConfig("soglie", c=>{ c.sogliaGiorni={urgente:u, attenzione:t}; }); };
  $$("[data-savecat]").forEach(b=>b.onclick=()=>{ const tr=b.closest("tr"), id=tr.dataset.cat; const v={};
    $$("[data-c]",tr).forEach(el=>v[el.dataset.c]= el.type==="checkbox"?el.checked : el.dataset.c==="periodicitaAnni" ? (el.value===""?null:Number(el.value)) : el.value.trim());
    modificaConfig("catalogo "+id, c=>{ const x=c.catalogo.find(x=>x.id===id); if(x) Object.assign(x,v); }); });
  $("#btnAddCat").onclick=async()=>{ const r=await dialogo({titolo:"Nuovo adempimento", corpo:`<div class="form"><label class="full">Nome<input name="nome" required autofocus></label>
      <label>Sezione<select name="sez">${sezioni().map(s=>`<option value="${s.id}">${esc(s.nome)}</option>`).join("")}</select></label>
      <label>Periodicità (anni, vuoto = nessuna)<input name="per" type="number" min="0" step="0.5"></label><label class="full">Riferimento normativo<input name="rif"></label></div>`, ok:"Aggiungi"});
    if(!dialogoOk(r)||!r.nome.trim()) return;
    modificaConfig("nuovo adempimento", c=>{ let id=slug(r.nome),n=2; while(c.catalogo.some(x=>x.id===id)) id=slug(r.nome)+"-"+(n++);
      c.catalogo.push({id, nome:r.nome.trim(), sezione:r.sez, periodicitaAnni:r.per===""?null:Number(r.per), riferimento:r.rif.trim(), prassi:false}); }); };
}
async function cambiaUtente(){ const u=S.utente; S.utente=""; if(!await chiediUtente()) S.utente=u; aggiornaStato(); if(S.store) render(); }

function bind(r,arg){
  $$("[data-reg]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); e.preventDefault(); const [id,cid]=b.dataset.reg.split("|"); registraAggiornamento(id,cid); });
  if(r==="aziende") bindAziende(); else if(r==="azienda") bindAzienda(arg); else if(r==="calendario") bindCalendario(); else if(r==="matrice") bindMatrice(); else if(r==="impostazioni") bindImpostazioni(); else bindScadenze();
}
